name: Security and supply chain

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "extension/**"
      - "security/**"
      - "scripts/security/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".gitleaks.toml"
      - "docker-compose.yml"
      - ".env.docker.example"
  push:
    branches:
      - master
      - phase-5-cicd-testing
    paths:
      - "backend/**"
      - "frontend/**"
      - "extension/**"
      - "security/**"
      - "scripts/security/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".gitleaks.toml"
      - "docker-compose.yml"
      - ".env.docker.example"
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Security policy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate supply-chain configuration
        run: python scripts/security/validate_supply_chain.py

      - name: Run Phase 5C contract test
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest tests/test_phase5c_supply_chain.py -q

  secret-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p build/security && printf '[]\n' > build/security/gitleaks.json

      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo
          --config /repo/.gitleaks.toml
          --redact
          --report-format json
          --report-path /repo/build/security/gitleaks.json
          --exit-code 1

      - name: Upload secret-scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: build/security/gitleaks.json
          if-no-files-found: warn
          retention-days: 30

  dependency-audit:
    name: Python and npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python audit tooling
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Audit Python dependencies
        continue-on-error: true
        run: >-
          python -m pip_audit
          -r backend/requirements.txt
          --format json
          --output build-pip-audit.json

      - name: Enforce Python vulnerability policy
        run: >-
          python scripts/security/enforce_pip_audit.py
          --report build-pip-audit.json
          --policy security/policy.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        continue-on-error: true
        shell: bash
        run: npm audit --json > ../build-npm-audit.json

      - name: Enforce npm vulnerability policy
        run: >-
          python scripts/security/enforce_npm_audit.py
          --report build-npm-audit.json
          --policy security/policy.json

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-reports
          path: |
            build-pip-audit.json
            build-npm-audit.json
          if-no-files-found: warn
          retention-days: 30

  repository-security:
    name: Repository scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p build/security

      - name: Generate repository vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "json"
          output: "build/security/trivy-filesystem.json"
          exit-code: "0"

      - name: Block critical repository vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          skip-setup-trivy: true

      - name: Generate container-configuration report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          format: "json"
          output: "build/security/trivy-config.json"
          exit-code: "0"
          skip-setup-trivy: true

      - name: Block critical container misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL"
          format: "table"
          exit-code: "1"
          skip-setup-trivy: true

      - name: Generate repository CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "cyclonedx"
          output: "build/security/repository.cdx.json"
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload repository security artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-security-reports
          path: build/security
          if-no-files-found: warn
          retention-days: 30

  image-security:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - configuration

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build application images
        run: |
          docker build -t my-digital-twin-backend:security backend
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --build-arg NEXT_PUBLIC_API_VERSION=v1 \
            --build-arg NEXT_PUBLIC_API_USE_VERSIONED_ROUTES=true \
            -t my-digital-twin-frontend:security frontend

      - name: Prepare report directory
        run: mkdir -p build/security

      - name: Report backend image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "my-digital-twin-backend:security"
          scanners: "vuln"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "json"
          output: "build/security/backend-image.json"
          exit-code: "0"

      - name: Block critical backend image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "my-digital-twin-backend:security"
          scanners: "vuln"
          vuln-type: "os,library"
          severity: "CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          skip-setup-trivy: true

      - name: Report frontend image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "my-digital-twin-frontend:security"
          scanners: "vuln"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "json"
          output: "build/security/frontend-image.json"
          exit-code: "0"
          skip-setup-trivy: true

      - name: Block critical frontend image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "my-digital-twin-frontend:security"
          scanners: "vuln"
          vuln-type: "os,library"
          severity: "CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          skip-setup-trivy: true

      - name: Generate backend image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "my-digital-twin-backend:security"
          scanners: "vuln"
          format: "cyclonedx"
          output: "build/security/backend-image.cdx.json"
          exit-code: "0"
          skip-setup-trivy: true

      - name: Generate frontend image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "my-digital-twin-frontend:security"
          scanners: "vuln"
          format: "cyclonedx"
          output: "build/security/frontend-image.cdx.json"
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload image security artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-security-reports
          path: build/security
          if-no-files-found: warn
          retention-days: 30
