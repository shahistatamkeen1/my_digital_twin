title = "My Digital Twin secret-scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholders and deterministic CI-only credentials"
regexTarget = "match"
regexes = [
  '''CHANGE_ME_[A-Z0-9_]+''',
  '''phase5-ci-secret-0123456789abcdef-0123456789abcdef''',
  '''phase5b-ci-secret-0123456789abcdef-0123456789abcdef''',
  '''phase5b_ci_url_safe_password''',
  '''phase5-test-secret-0123456789abcdef-0123456789abcdef''',
  '''phase5e-test-secret-0123456789abcdef-0123456789abcdef''',
  '''phase5e-local-secret-0123456789abcdef-0123456789abcdef''',
  '''test-password-test-password''',
  '''Phase6A-Test-Password-2026''',
  '''Phase6B-Test-Password-2026''',
  '''Phase6D-Test-Password-2026'''
]

[[allowlists]]
description = "Environment templates contain placeholders, never real credentials"
paths = [
  '''(^|/)\.env\.docker\.example$''',
  '''(^|/)backend/\.env\.example$''',
  '''(^|/)frontend/\.env\.example$'''
]
