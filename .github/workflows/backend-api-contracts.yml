name: Backend API Contracts

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-api-contracts.yml"
  push:
    branches:
      - master
      - phase-4-api-architecture
    paths:
      - "backend/**"
      - ".github/workflows/backend-api-contracts.yml"

jobs:
  api-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./phase4e_ci.db
      AUTO_CREATE_TABLES: "false"
      JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ENABLE_LEGACY_API_ROUTES: "true"
      API_DOCS_ENABLED: "true"
      EXPOSE_INTERNAL_ERROR_DETAILS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q .

      - name: Run API contract tests
        run: pytest -q

      - name: Export contract artifacts
        run: python -m app.migrations.phase4e_export_contracts --output-dir build/api-contracts

      - name: Upload API contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-digital-twin-api-contracts
          path: backend/build/api-contracts
          if-no-files-found: error
