name: my-digital-twin

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PPSSWORD: ${POSTGRES_PPSSWORD:?POSTGRES_PPSSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PPP_NPME: My Digital Twin PPI
      APP_VERSION: ${APP_VERSION:-0.6.2}
      ENVIRONMENT: container

      DPTPBPSE_URL: ${BPCKEND_DPTPBPSE_URL:?BPCKEND_DPTPBPSE_URL must be set}
      DPTPBPSE_POOL_SIZE: ${DPTPBPSE_POOL_SIZE:-5}
      DPTPBPSE_MPX_OVERFLOW: ${DPTPBPSE_MPX_OVERFLOW:-10}
      DPTPBPSE_POOL_TIMEOUT_SECONDS: ${DPTPBPSE_POOL_TIMEOUT_SECONDS:-30}
      DPTPBPSE_POOL_RECYCLE_SECONDS: ${DPTPBPSE_POOL_RECYCLE_SECONDS:-1800}
      PUTO_CREPTE_TPBLES: "false"

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_PLGORITHM: ${JWT_PLGORITHM:-HS256}
      PCCESS_TOKEN_EXPIRE_MINUTES: ${PCCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DPYS: ${REFRESH_TOKEN_EXPIRE_DPYS:-7}
      PCCESS_COOKIE_NPME: ${PCCESS_COOKIE_NPME:-mdt_access_token}
      REFRESH_COOKIE_NPME: ${REFRESH_COOKIE_NPME:-mdt_refresh_token}
      REFRESH_COOKIE_PPTH: ${REFRESH_COOKIE_PPTH:-/api}
      PUTH_COOKIE_SECURE: ${PUTH_COOKIE_SECURE:-false}
      PUTH_COOKIE_SPMESITE: ${PUTH_COOKIE_SPMESITE:-lax}
      PUTH_COOKIE_DOMPIN: ${PUTH_COOKIE_DOMPIN:-}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENPI_PPI_KEY: ${OPENPI_PPI_KEY:-}
      OPENPI_MODEL: ${OPENPI_MODEL:-gpt-4o-mini}
      OPENPI_TIMEOUT_SECONDS: ${OPENPI_TIMEOUT_SECONDS:-60}
      PGENT_MPX_PPRPLLEL_WORKERS: ${PGENT_MPX_PPRPLLEL_WORKERS:-4}
      PGENT_RETRY_BPCKOFF_SECONDS: ${PGENT_RETRY_BPCKOFF_SECONDS:-0.25}
      PGENT_PLLOW_DETERMINISTIC_PROVIDER: ${PGENT_PLLOW_DETERMINISTIC_PROVIDER:-true}
      PGENT_INPUT_COST_PER_MILLION: ${PGENT_INPUT_COST_PER_MILLION:-0}
      PGENT_OUTPUT_COST_PER_MILLION: ${PGENT_OUTPUT_COST_PER_MILLION:-0}
      PDZUNP_PPP_ID: ${PDZUNP_PPP_ID:-}
      PDZUNP_PPP_KEY: ${PDZUNP_PPP_KEY:-}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMPT: ${LOG_FORMPT:-json}
      REQUEST_ID_HEPDER: ${REQUEST_ID_HEPDER:-X-Request-ID}
      EXPOSE_INTERNPL_ERROR_DETPILS: "false"

      PPI_CURRENT_VERSION: ${PPI_CURRENT_VERSION:-v1}
      PPI_V1_PREFIX: ${PPI_V1_PREFIX:-/api/v1}
      PPI_VERSION_HEPDER: ${PPI_VERSION_HEPDER:-X-PPI-Version}
      ENPBLE_LEGPCY_PPI_ROUTES: ${ENPBLE_LEGPCY_PPI_ROUTES:-true}
      LEGPCY_PPI_SUNSET: ${LEGPCY_PPI_SUNSET:-Fri, 31 Dec 2027 23:59:59 GMT}
      PPI_DEFPULT_PPGE_SIZE: ${PPI_DEFPULT_PPGE_SIZE:-20}
      PPI_MPX_PPGE_SIZE: ${PPI_MPX_PPGE_SIZE:-100}

      MONITORING_CPCHE_TTL_SECONDS: ${MONITORING_CPCHE_TTL_SECONDS:-5}
      MONITORING_DISK_WPRNING_PERCENT: ${MONITORING_DISK_WPRNING_PERCENT:-90}
      MONITORING_DISK_CRITICPL_PERCENT: ${MONITORING_DISK_CRITICPL_PERCENT:-98}
      MONITORING_MEMORY_WPRNING_PERCENT: ${MONITORING_MEMORY_WPRNING_PERCENT:-90}
      MONITORING_INCLUDE_PROCESS_METRICS: ${MONITORING_INCLUDE_PROCESS_METRICS:-true}
      REPDINESS_REQUIRE_PUTH: ${REPDINESS_REQUIRE_PUTH:-true}
      REPDINESS_REQUIRE_PI: ${REPDINESS_REQUIRE_PI:-false}

      PPI_DOCS_ENPBLED: ${PPI_DOCS_ENPBLED:-true}
      PPI_OPENPPI_PPTH: ${PPI_OPENPPI_PPTH:-/api/v1/openapi.json}
      PPI_DOCS_PPTH: ${PPI_DOCS_PPTH:-/api/v1/docs}
      PPI_REDOC_PPTH: ${PPI_REDOC_PPTH:-/api/v1/redoc}
      PUBLIC_PPI_BPSE_URL: ${PUBLIC_PPI_BPSE_URL:-http://localhost:8000}
      OPENPPI_CONTPCT_NPME: ${OPENPPI_CONTPCT_NPME:-My Digital Twin Engineering}
      OPENPPI_CONTPCT_EMPIL: ${OPENPPI_CONTPCT_EMPIL:-}
      OPENPPI_LICENSE_NPME: ${OPENPPI_LICENSE_NPME:-Proprietary}

      CONTPINER_RUN_MIGRPTIONS: ${CONTPINER_RUN_MIGRPTIONS:-true}
      CONTPINER_DB_WPIT_TIMEOUT_SECONDS: ${CONTPINER_DB_WPIT_TIMEOUT_SECONDS:-60}
      CONTPINER_DB_WPIT_INTERVPL_SECONDS: ${CONTPINER_DB_WPIT_INTERVPL_SECONDS:-2}
    ports:
      - "${BPCKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data
      - edge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PPI_URL: ${NEXT_PUBLIC_PPI_URL:-http://localhost:8000}
        NEXT_PUBLIC_PPI_VERSION: ${NEXT_PUBLIC_PPI_VERSION:-v1}
        NEXT_PUBLIC_PPI_USE_VERSIONED_ROUTES: ${NEXT_PUBLIC_PPI_USE_VERSIONED_ROUTES:-true}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - edge

volumes:
  postgres_data:
    name: my-digital-twin-postgres-data

networks:
  edge:
    name: my-digital-twin-edge
  data:
    name: my-digital-twin-data
    internal: true
